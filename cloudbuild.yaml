steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/blinka/blinka:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/blinka/blinka:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - blinka-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/blinka/blinka:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8080
      - --min-instances=0
      - --max-instances=3
      - --cpu=1
      - --memory=1Gi
      - --concurrency=20
      - --allow-unauthenticated
      - --set-env-vars=BLINKA_MEMORY_BACKEND=local,BLINKA_MAX_PDF_PAGES=100,BLINKA_MAX_EXTRACTED_TEXT_BYTES=1048576
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/blinka/blinka:$COMMIT_SHA
